name: Update country news

on:
  schedule:
    - cron: "17 0,12 * * *"   # 09:17 and 21:17 Korea time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/news.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch headlines
        run: python scripts/fetch_news.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news
          if git diff --cached --quiet; then
            echo "no changes"
            echo "changed=0" >> "$GITHUB_ENV"
          else
            git commit -m "뉴스 갱신"
            git pull --rebase origin main
            git push
            echo "changed=1" >> "$GITHUB_ENV"
          fi
      - name: Rebuild the site
        if: env.changed == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
