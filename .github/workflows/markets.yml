name: Update stock indexes

on:
  schedule:
    - cron: "37 22 * * 1-5"   # 07:37 Korea time, after the US close
    - cron: "37 7 * * 1-5"    # 16:37 Korea time, after most Asian markets close
    - cron: "7 16 * * 1-5"    # 01:07 Korea time, after European markets close
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_markets.py"
      - "scripts/markets.json"
      - ".github/workflows/markets.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  markets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch index levels
        run: python scripts/fetch_markets.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add markets.json
          if git diff --cached --quiet; then
            echo "changed=0" >> "$GITHUB_ENV"
          else
            git commit -m "주가지수 갱신"
            git pull --rebase origin main
            git push
            echo "changed=1" >> "$GITHUB_ENV"
          fi
      - name: Rebuild the site
        if: env.changed == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
