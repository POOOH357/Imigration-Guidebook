name: Update World Bank data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_wb.py"
      - ".github/workflows/worldbank.yml"

permissions:
  contents: write

concurrency:
  group: worldbank
  cancel-in-progress: false

jobs:
  wb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch indicators
        run: python scripts/fetch_wb.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "세계은행 통계 갱신"
            git pull --rebase origin main
            git push
          fi
